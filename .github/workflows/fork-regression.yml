name: Fork regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [hermes/final-B-ci-20261109]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listings-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_listings.py
